[package]
name = "proxyhand"
version = "0.1.14"
edition = "2024"
rust-version = "1.85"
description = "HTTP/HTTPS/SSE/WebSocket interception proxy with a built-in web UI"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/xiegoudan/proxyhand"
keywords = ["proxy", "mitm", "debugging", "sse", "websocket"]
categories = ["development-tools::debugging", "network-programming"]

[dependencies]
base64 = "0.23.1"
brotli = "9.1.3"
bytes = "1.12.2"
chrono = "0.4.45"
flate2 = "1.1.11"
futures-util = "0.3.34"
hostname = "0.4.2"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
if-addrs = "0.15.0"
pin-project-lite = "0.2.17"
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
url = "2.5.8"
webpki-roots = "1.0.12"

[dev-dependencies]
bytes = "1.12.2"
flate2 = "1.1.11"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
